<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0c0c0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="モード">
<title>モード切替</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0c0c0e;
    --surface: #14141a;
    --border: #22222e;
    --c0: #8a8a9e;
    --c0rgb: 138,138,158;
    --c1: #5b9bd5;
    --c1rgb: 91,155,213;
    --c2: #d4a520;
    --c2rgb: 212,165,32;
    --c3: #2ec4a0;
    --c3rgb: 46,196,160;
    --text: #e8e8f2;
    --muted: #44445a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 48px 24px;
    padding-top: max(48px, env(safe-area-inset-top));
    padding-bottom: max(48px, env(safe-area-inset-bottom));
  }

  .ambient {
    position: fixed;
    inset: 0;
    pointer-events: none;
    transition: background 1.4s ease;
    z-index: 0;
  }

  .header {
    text-align: center;
    z-index: 1;
  }

  .header .label {
    font-family: 'Noto Serif JP', serif;
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .header .mode-name {
    font-family: 'Noto Serif JP', serif;
    font-size: 30px;
    font-weight: 300;
    letter-spacing: 0.06em;
    min-height: 42px;
    transition: opacity 0.35s, color 0.6s;
  }

  .header .bar {
    height: 2px;
    width: 40px;
    border-radius: 2px;
    margin: 12px auto 0;
    transition: background 0.6s, width 0.5s;
    background: var(--muted);
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 340px;
    z-index: 1;
  }

  .btn {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    transition: border-color 0.4s, box-shadow 0.4s, transform 0.12s, background 0.4s;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active { transform: scale(0.96); }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.5s ease;
    border-radius: 16px;
  }

  .btn::after {
    content: '';
    position: absolute;
    left: 0; top: 20%; bottom: 20%;
    width: 3px;
    border-radius: 0 3px 3px 0;
    background: transparent;
    transition: background 0.4s, top 0.4s, bottom 0.4s;
  }

  .btn.active::after { top: 12%; bottom: 12%; }

  .btn .icon-wrap {
    width: 42px; height: 42px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    background: var(--border);
    transition: background 0.4s, box-shadow 0.4s;
    position: relative; z-index: 1;
  }

  .btn .info { flex: 1; position: relative; z-index: 1; }

  .btn .name {
    font-family: 'Noto Serif JP', serif;
    font-size: 15px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 4px;
  }

  .btn .desc {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.1em;
    line-height: 1.6;
    transition: color 0.4s;
  }

  .btn .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.4s, box-shadow 0.4s;
    flex-shrink: 0;
    position: relative; z-index: 1;
  }

  .btn[data-mode="0"]::before { background: radial-gradient(ellipse at 0% 50%, rgba(var(--c0rgb),0.14) 0%, transparent 75%); }
  .btn[data-mode="0"]::after  { background: rgba(var(--c0rgb),0.7); }
  .btn[data-mode="0"].active  { border-color: rgba(var(--c0rgb),0.45); box-shadow: 0 0 28px rgba(var(--c0rgb),0.12); background: #17171e; }
  .btn[data-mode="0"].active::before { opacity: 1; }
  .btn[data-mode="0"].active .icon-wrap { background: rgba(var(--c0rgb),0.18); box-shadow: 0 0 14px rgba(var(--c0rgb),0.2); }
  .btn[data-mode="0"].active .dot { background: rgb(var(--c0rgb)); box-shadow: 0 0 8px 2px rgba(var(--c0rgb),0.6); }
  .btn[data-mode="0"].active .desc { color: rgba(var(--c0rgb),0.7); }

  .btn[data-mode="1"]::before { background: radial-gradient(ellipse at 0% 50%, rgba(var(--c1rgb),0.14) 0%, transparent 75%); }
  .btn[data-mode="1"]::after  { background: rgba(var(--c1rgb),0.8); }
  .btn[data-mode="1"].active  { border-color: rgba(var(--c1rgb),0.45); box-shadow: 0 0 32px rgba(var(--c1rgb),0.15); background: #13161e; }
  .btn[data-mode="1"].active::before { opacity: 1; }
  .btn[data-mode="1"].active .icon-wrap { background: rgba(var(--c1rgb),0.18); box-shadow: 0 0 16px rgba(var(--c1rgb),0.25); }
  .btn[data-mode="1"].active .dot { background: rgb(var(--c1rgb)); box-shadow: 0 0 8px 2px rgba(var(--c1rgb),0.6); }
  .btn[data-mode="1"].active .desc { color: rgba(var(--c1rgb),0.7); }

  .btn[data-mode="2"]::before { background: radial-gradient(ellipse at 0% 50%, rgba(var(--c2rgb),0.13) 0%, transparent 75%); }
  .btn[data-mode="2"]::after  { background: rgba(var(--c2rgb),0.85); }
  .btn[data-mode="2"].active  { border-color: rgba(var(--c2rgb),0.45); box-shadow: 0 0 32px rgba(var(--c2rgb),0.13); background: #181610; }
  .btn[data-mode="2"].active::before { opacity: 1; }
  .btn[data-mode="2"].active .icon-wrap { background: rgba(var(--c2rgb),0.18); box-shadow: 0 0 16px rgba(var(--c2rgb),0.25); }
  .btn[data-mode="2"].active .dot { background: rgb(var(--c2rgb)); box-shadow: 0 0 8px 2px rgba(var(--c2rgb),0.55); }
  .btn[data-mode="2"].active .desc { color: rgba(var(--c2rgb),0.7); }

  .btn[data-mode="3"]::before { background: radial-gradient(ellipse at 0% 50%, rgba(var(--c3rgb),0.13) 0%, transparent 75%); }
  .btn[data-mode="3"]::after  { background: rgba(var(--c3rgb),0.8); }
  .btn[data-mode="3"].active  { border-color: rgba(var(--c3rgb),0.45); box-shadow: 0 0 32px rgba(var(--c3rgb),0.14); background: #111a18; }
  .btn[data-mode="3"].active::before { opacity: 1; }
  .btn[data-mode="3"].active .icon-wrap { background: rgba(var(--c3rgb),0.18); box-shadow: 0 0 16px rgba(var(--c3rgb),0.25); }
  .btn[data-mode="3"].active .dot { background: rgb(var(--c3rgb)); box-shadow: 0 0 8px 2px rgba(var(--c3rgb),0.55); }
  .btn[data-mode="3"].active .desc { color: rgba(var(--c3rgb),0.7); }
</style>
</head>
<body>

<div class="ambient" id="ambient"></div>

<div class="header">
  <div class="label">現在のモード</div>
  <div class="mode-name" id="modeName">—</div>
  <div class="bar" id="bar"></div>
</div>

<div class="buttons" id="buttons"></div>

<script>
const modes = [
  { id: 0, icon: '◎', name: 'オフ',  desc: 'どのモードでもない、素の時間', color: '#8a8a9e', ambient: 'rgba(138,138,158,0.05)' },
  { id: 1, icon: '◈', name: '勉強',  desc: '授業・独学。理解することだけ考える', color: '#5b9bd5', ambient: 'rgba(91,155,213,0.07)' },
  { id: 2, icon: '▣', name: 'バイト', desc: 'タスク処理モード。役割に徹する', color: '#d4a520', ambient: 'rgba(212,165,32,0.06)' },
  { id: 3, icon: '●', name: '没入',  desc: '作品・ゲーム。感受性全開、一点集中', color: '#2ec4a0', ambient: 'rgba(46,196,160,0.07)' },
];

let currentMode = null;

const btnContainer = document.getElementById('buttons');
const modeNameEl  = document.getElementById('modeName');
const barEl       = document.getElementById('bar');
const ambientEl   = document.getElementById('ambient');

modes.forEach(m => {
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.dataset.mode = m.id;
  btn.innerHTML = `
    <div class="icon-wrap">${m.icon}</div>
    <div class="info">
      <div class="name">${m.name}</div>
      <div class="desc">${m.desc}</div>
    </div>
    <span class="dot"></span>
  `;
  btn.addEventListener('click', () => activate(m.id));
  btnContainer.appendChild(btn);
});

function activate(id, save = true) {
  if (currentMode === id) return;
  currentMode = id;
  const m = modes[id];

  modeNameEl.style.opacity = 0;
  setTimeout(() => {
    modeNameEl.textContent = m.name;
    modeNameEl.style.color = m.color;
    modeNameEl.style.opacity = 1;
  }, 160);

  barEl.style.background = m.color;
  barEl.style.width = '56px';
  ambientEl.style.background = `radial-gradient(ellipse at 25% 35%, ${m.ambient} 0%, transparent 65%)`;

  document.querySelectorAll('.btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.mode) === id);
  });

  if (save) localStorage.setItem('mode', id);
}

// 保存されたモードを復元
const saved = localStorage.getItem('mode');
activate(saved !== null ? parseInt(saved) : 0, false);
</script>
</body>
</html>
